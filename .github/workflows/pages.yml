# Publishes swipe.html as a web page: https://<owner>.github.io/<repo>/
# One-time setup: repository Settings → Pages → Source: "GitHub Actions".
name: Web page

on:
  push:
    branches: [main]
    paths: [swipe.html, web/icons/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: |
          mkdir -p _site/icons
          cp swipe.html _site/index.html
          cp web/icons/icon.svg web/icons/apple-touch-icon.png web/icons/icon-192.png _site/icons/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
      - id: deployment
        uses: actions/deploy-pages@v4
