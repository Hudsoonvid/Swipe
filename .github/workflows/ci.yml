name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Server, web & desktop tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm ci --prefix server
      - run: npm ci --prefix desktop
      - name: Install Chromium for the browser tests
        run: npx playwright-core install --with-deps chromium
      - run: npm test --prefix server
      - name: swipe.html is up to date with its sources
        run: npm run build:standalone && git diff --exit-code swipe.html
      - run: npm test --prefix desktop
      - name: End-to-end tests (browser + desktop app on a virtual display)
        run: xvfb-run -a -s "-screen 0 1280x800x24" npm run test:e2e
      - name: Docker image builds
        run: docker build -t swipe .

  desktop:
    name: Desktop app (${{ matrix.os }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix desktop
      - name: Build installer
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          SWIPE_SERVER: ${{ vars.SWIPE_SERVER }}
        shell: bash
        run: |
          if [ -n "$SWIPE_SERVER" ]; then
            node -e "const f='package.json',p=require('./'+f);p.swipeServer=process.env.SWIPE_SERVER;require('fs').writeFileSync(f,JSON.stringify(p,null,2))"
          fi
          npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: swipe-desktop-${{ runner.os }}
          path: |
            desktop/release/*.exe
            desktop/release/*.dmg
            desktop/release/*.AppImage
          if-no-files-found: error

  android:
    name: Android app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests and APK
        working-directory: android
        env:
          SWIPE_SERVER: ${{ vars.SWIPE_SERVER }}
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease ${SWIPE_SERVER:+-PswipeServer=$SWIPE_SERVER}
      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk Swipe-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: swipe-android
          path: Swipe-android.apk
          if-no-files-found: error

  ios:
    name: iOS app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pairing crypto tests (shared vectors)
        working-directory: ios/SwipeCore
        run: swift test
      - name: Generate Xcode project
        working-directory: ios
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build for the simulator
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project Swipe.xcodeproj -scheme Swipe -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -n 40
      - name: Build unsigned device app (for sideloading)
        working-directory: ios
        env:
          SWIPE_SERVER: ${{ vars.SWIPE_SERVER }}
        run: |
          set -o pipefail
          xcodebuild -project Swipe.xcodeproj -scheme Swipe -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO SWIPE_SERVER="$SWIPE_SERVER" build | tail -n 40
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Swipe.app Payload/
          zip -qr ../Swipe-ios-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: swipe-ios-unsigned
          path: Swipe-ios-unsigned.ipa
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [desktop, android, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
